
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة أبو إسلام لقطع غيار التوك توك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .tab-content { display: none; } .tab-content.active { display: block; } 
        .chat-bubble-admin { background-color: #d1fae5; border-radius: 10px 10px 0 10px; padding: 8px; margin-bottom: 8px; text-align: right; width: 80%; margin-right: auto; }
        .chat-bubble-client { background-color: #f3f4f6; border-radius: 10px 10px 10px 0; padding: 8px; margin-bottom: 8px; text-align: right; width: 80%; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="bg-gray-900 text-white sticky top-0 z-50 shadow-md">
        <h1 class="text-center font-black text-amber-500 py-3 text-xl"><i class="fa-solid fa-store"></i> لوحة الإدارة</h1>
        <div class="flex overflow-x-auto text-sm font-bold">
            <button onclick="switchAdminTab('tabSearch')" id="btn-tabSearch" class="flex-1 py-3 border-b-4 border-amber-500 text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-bolt"></i> الطوارئ</button>
            <button onclick="switchAdminTab('tabOrders')" id="btn-tabOrders" class="flex-1 py-3 border-b-4 border-transparent hover:text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-bell"></i> الطلبات</button>
            <button onclick="switchAdminTab('tabCustomers')" id="btn-tabCustomers" class="flex-1 py-3 border-b-4 border-transparent hover:text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-users"></i> العملاء</button>
            <button onclick="switchAdminTab('tabData')" id="btn-tabData" class="flex-1 py-3 border-b-4 border-transparent hover:text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-file-excel"></i> الإكسيل</button>
        </div>
    </div>

    <div class="p-4 max-w-6xl mx-auto">

        <!-- ========================================== -->
        <!-- 1. دليل الأسعار + كاشير الطوارئ -->
        <!-- ========================================== -->
        <div id="tabSearch" class="tab-content active">
            <div class="bg-white p-4 rounded-xl shadow border-t-4 border-emerald-500 mb-6">
                <div class="flex gap-2 mb-2"><input type="text" id="adminSearchInput" oninput="debouncedSearch()" placeholder="اكتب الصنف أو الباركود..." class="w-full p-3 border-2 border-emerald-500 rounded-lg text-lg font-bold bg-gray-50 shadow-inner"><button onclick="startAdminScanner()" class="bg-emerald-500 text-white px-5 rounded-lg shadow font-bold hover:bg-emerald-600"><i class="fa-solid fa-barcode text-2xl"></i></button></div>
                <div id="adminReaderContainer" class="hidden mb-4 relative"><div id="adminReader" class="w-full rounded-xl overflow-hidden border-4 border-emerald-500 bg-black min-h-[250px]"></div><button onclick="stopAdminScanner()" class="mt-2 bg-red-100 text-red-600 px-4 py-2 rounded font-bold w-full">إغلاق الكاميرا</button></div>
                <div id="adminSearchResults" class="max-h-64 overflow-y-auto pr-2 space-y-2 mb-2"></div>
            </div>
            
            <div class="bg-gray-900 p-4 rounded-xl shadow-lg border-t-4 border-amber-500">
                <div class="flex justify-between items-center mb-4 text-white">
                    <h2 class="text-xl font-bold"><i class="fa-solid fa-receipt text-amber-500"></i> فاتورة طوارئ</h2>
                </div>
                <div id="adminCartContainer" class="bg-white rounded-lg p-2 mb-4 min-h-[100px] max-h-64 overflow-y-auto space-y-2"></div>
                <div class="flex justify-between items-center bg-gray-800 p-3 rounded-lg text-white mb-4"><span class="font-bold">الإجمالي:</span><span class="font-black text-2xl text-amber-500" id="adminCartTotal">0 ج</span></div>
                <div class="grid grid-cols-2 gap-2">
                    <!-- التعديل هنا: حفظ كطلب، ومشاركة واتساب رجعت -->
                    <button onclick="saveAdminInvoiceToOrders()" class="bg-amber-500 text-gray-900 font-bold py-2 rounded shadow hover:bg-amber-600">حفظ كطلب</button>
                    <button onclick="shareAdminInvoice()" class="bg-green-600 text-white font-bold py-2 rounded shadow hover:bg-green-700"><i class="fa-brands fa-whatsapp"></i> مشاركة واتساب</button>
                    <button onclick="showBarcodesForPCOffline()" class="col-span-2 bg-blue-600 text-white font-bold py-2 rounded">عرض الباركودات للكمبيوتر</button>
                    <button onclick="clearAdminCart()" class="col-span-2 text-red-400 font-bold py-2 underline text-sm">مسح الفاتورة</button>
                </div>
            </div>
        </div>

        <div id="pcBarcodesModal" class="fixed inset-0 bg-black bg-opacity-80 z-[1002] hidden flex items-center justify-center p-4"><div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-6 flex flex-col"><div class="flex justify-between items-center mb-4 border-b pb-2"><h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-barcode text-blue-500"></i> باركودات الفاتورة</h2><button onclick="closePcBarcodesModal()" class="text-red-500 font-black text-2xl">&times;</button></div><textarea id="pcBarcodesArea" class="w-full h-48 p-3 border-2 border-blue-500 rounded bg-gray-50 font-bold text-lg text-left" dir="ltr" readonly></textarea><button onclick="copyFromTextarea()" class="mt-4 bg-blue-600 text-white font-bold py-3 rounded-lg shadow">نسخ الكل</button></div></div>

        <!-- ========================================== -->
        <!-- 2. الطلبات (شيلنا تصدير الإكسيل) -->
        <!-- ========================================== -->
        <div id="tabOrders" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-list-check text-amber-600"></i> طلبات العملاء والطوارئ</h2>
            </div>
            <div id="ordersCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <div id="orderChatModal" class="fixed inset-0 bg-black bg-opacity-80 z-[1003] hidden flex items-center justify-center p-4"><div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-4 flex flex-col h-[80vh]"><div class="flex justify-between items-center mb-4 border-b pb-2"><h2 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-comments text-blue-500"></i> مناقشة الفاتورة</h2><button onclick="closeOrderChat()" class="text-red-500 font-black text-2xl">&times;</button></div><div id="chatMessagesArea" class="flex-1 overflow-y-auto bg-gray-50 p-2 rounded border mb-2 flex flex-col"></div><div class="flex gap-2"><input type="text" id="chatInput" placeholder="اكتب رسالتك للعميل..." class="flex-1 p-2 border rounded font-bold"><button onclick="sendOrderChatMessage()" class="bg-blue-600 text-white px-4 rounded font-bold"><i class="fa-solid fa-paper-plane"></i></button></div></div></div>

        <!-- ========================================== -->
        <!-- 3. العملاء (تعديل الـ CRM بالكامل) -->
        <!-- ========================================== -->
        <div id="tabCustomers" class="tab-content">
            <div class="bg-white p-4 rounded-xl shadow mb-6 border-r-4 border-purple-500"><h2 class="font-bold mb-3"><i class="fa-solid fa-user-clock text-purple-500"></i> طلبات التسجيل المعلقة</h2><div id="pendingUsersContainer" class="space-y-2"></div></div>
            <div class="bg-white p-4 rounded-xl shadow mb-6 border-r-4 border-red-500"><h2 class="font-bold mb-3"><i class="fa-solid fa-money-bill-transfer text-red-500"></i> خصم رصيد بونص لعميل</h2><div class="flex gap-2 mb-2"><input type="tel" id="customerPhone" placeholder="رقم الهاتف (+20...)" class="w-full p-2 border rounded" dir="ltr"><button onclick="checkCustomerBalance()" class="bg-gray-800 text-white px-4 rounded font-bold">استعلام</button></div><div id="balanceResult" class="hidden bg-gray-50 p-3 rounded border text-sm mt-2"><p>العميل: <span id="cName" class="font-bold text-blue-600"></span> | الرصيد المتاح: <span id="cBalance" class="font-black text-green-600"></span> ج</p><div class="flex gap-2 mt-2"><input type="number" id="deductAmount" placeholder="المبلغ" class="w-full p-2 border rounded font-bold"><button onclick="deductBalance()" class="bg-red-600 text-white px-4 rounded font-bold">خصم</button></div></div></div>
            
            <div class="bg-white p-4 rounded-xl shadow border-r-4 border-blue-500">
                <h2 class="font-bold mb-3 flex justify-between items-center"><i class="fa-solid fa-database text-blue-500"></i> قاعدة العملاء <button onclick="loadAllCustomers()" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">تحديث</button></h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm border-collapse">
                        <thead><tr class="bg-gray-100"><th class="p-2 border">العميل</th><th class="p-2 border text-center">الفواتير<br>(إجمالي/مؤكد)</th><th class="p-2 border text-center">المحاولات</th><th class="p-2 border text-center">البونص</th></tr></thead>
                        <tbody id="crmTableBody"><tr><td colspan="4" class="p-2 text-center text-gray-500">اضغط تحديث</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 4. الإكسيل -->
        <!-- ========================================== -->
        <div id="tabData" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-xl shadow border-r-4 border-blue-500"><h2 class="font-bold mb-2">رفع شيت الأصناف (Excel)</h2><input type="file" id="productsFile" accept=".xlsx, .xls, .csv" class="mb-4 block w-full text-sm"><button onclick="processProductsExcel()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold w-full">رفع الأصناف</button><p id="productsStatus" class="mt-2 text-sm text-center font-bold"></p></div>
                <div class="bg-white p-6 rounded-xl shadow border-r-4 border-green-500"><h2 class="font-bold mb-2">تأكيد الفواتير (شيت البونص)</h2><input type="file" id="bonusFile" accept=".xlsx, .xls, .csv" class="mb-4 block w-full text-sm"><button onclick="processBonusExcel()" class="bg-green-600 text-white px-4 py-2 rounded font-bold w-full">تأكيد وتوزيع البونص</button><p id="bonusStatus" class="mt-2 text-sm text-center font-bold"></p></div>
            </div>
        </div>
    </div>

    <!-- أكواد Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, getDocs, doc, writeBatch, query, where, updateDoc, getDoc, increment, deleteDoc, arrayUnion, addDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA5OY4oagUmG8WaWpqFWYzzEvMxQkf2j3c", authDomain: "abu-islam-auto.firebaseapp.com", projectId: "abu-islam-auto", storageBucket: "abu-islam-auto.firebasestorage.app", messagingSenderId: "914603263591", appId: "1:914603263591:web:f5e283f0e0fbec3259f6c2" };
        const app = initializeApp(firebaseConfig);
        const db = window.db = getFirestore(app); 

        enableIndexedDbPersistence(db).catch((err) => { console.log("Offline error"); });

        window.playBeep = function() { try { const AudioContext = window.AudioContext || window.webkitAudioContext; const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gainNode = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); gainNode.gain.setValueAtTime(0.1, ctx.currentTime); osc.connect(gainNode); gainNode.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.1); } catch(e) {} }

        // -------------------------
        // حفظ فاتورة الطوارئ في الطلبات مباشرة
        // -------------------------
        window.saveAdminInvoiceToOrders = async function() {
            if(window.adminCart.length === 0) return alert("الفاتورة فارغة!");
            let total = 0; window.adminCart.forEach(i => total += i.price * i.qty);
            try {
                await addDoc(collection(db, "Orders"), {
                    customerName: "فاتورة طوارئ (محل)", phone: "مباشر", area: "المحل",
                    date: new Date().toLocaleString("ar-EG"), timestamp: new Date().getTime(),
                    items: window.adminCart, totalAmount: total, status: "تأكيد وإغلاق", orderType: "طوارئ"
                });
                alert("تم حفظ الفاتورة في (الطلبات) بنجاح!");
                window.adminCart = []; updateAdminCartUI();
            } catch(e) { alert("حدث خطأ."); }
        }

        // -------------------------
        // 1. الطلبات والشات اللحظي
        // -------------------------
        window.allActiveOrders = []; 
        onSnapshot(collection(db, "Orders"), (snapshot) => {
            const container = document.getElementById('ordersCardsContainer'); container.innerHTML = '';
            window.allActiveOrders = []; 
            snapshot.forEach(d => window.allActiveOrders.push({ id: d.id, ...d.data() }));
            window.allActiveOrders.sort((a, b) => b.timestamp - a.timestamp);

            if(window.allActiveOrders.length === 0) { container.innerHTML = '<p class="col-span-full text-center text-gray-500 mt-10 font-bold">لا توجد طلبات.</p>'; }
            else {
                window.allActiveOrders.forEach(o => {
                    let itemsList = o.items.map(i => `<span class="bg-gray-100 text-gray-700 text-xs px-2 py-1 rounded inline-block m-0.5 border border-gray-300 font-bold">${i.name} (${i.qty})</span>`).join('');
                    let statusBg = 'bg-yellow-100 text-yellow-800';
                    if(o.status === 'جاري التجهيز') statusBg = 'bg-blue-100 text-blue-800';
                    if(o.status === 'تأكيد وإغلاق' || o.status === 'تم التسليم') statusBg = 'bg-green-100 text-green-800';
                    let orderTypeBadge = o.orderType === 'wholesale' ? '<span class="bg-purple-600 text-white text-[10px] px-1 rounded ml-1">جملة</span>' : (o.orderType === 'طوارئ' ? '<span class="bg-red-600 text-white text-[10px] px-1 rounded ml-1">طوارئ</span>' : '<span class="bg-blue-600 text-white text-[10px] px-1 rounded ml-1">قطاعي</span>');
                    let msgCount = o.chat ? o.chat.length : 0;
                    let chatBtnClass = msgCount > 0 ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700';

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow border-t-4 border-amber-500 flex flex-col relative">
                            <div class="flex justify-between items-start border-b pb-2 mb-2"><div><h3 class="font-black text-lg text-gray-800">${orderTypeBadge}${o.customerName}</h3><p class="text-xs text-gray-500 font-bold" dir="ltr">${o.phone}</p></div><span class="text-xs font-bold px-2 py-1 rounded ${statusBg}">${o.status}</span></div>
                            <div class="mb-3">${itemsList}</div>
                            <div class="mt-auto border-t pt-3 flex justify-between items-center mb-3"><span class="text-gray-600 font-bold text-sm">الإجمالي:</span><span class="font-black text-green-600 text-xl">${o.totalAmount} ج</span></div>
                            <button onclick="showOrderBarcodesForPC('${o.id}')" class="bg-purple-600 text-white text-xs font-bold py-2 rounded shadow mb-3 w-full"><i class="fa-solid fa-copy"></i> عرض الباركودات للكمبيوتر</button>
                            <div class="grid grid-cols-2 gap-2 mt-2"><select onchange="updateOrderStatus('${o.id}', this.value)" class="bg-gray-50 border text-xs font-bold rounded p-2"><option disabled selected>تغيير الحالة</option><option value="في انتظار التأكيد">في انتظار التأكيد</option><option value="جاري التجهيز">جاري التجهيز</option><option value="تأكيد وإغلاق">تأكيد وإغلاق</option></select><button onclick="openOrderChat('${o.id}')" class="${chatBtnClass} text-xs font-bold py-2 rounded shadow"><i class="fa-solid fa-comments"></i> شات الفاتورة (${msgCount})</button></div>
                            <button onclick="deleteOrder('${o.id}')" class="absolute top-4 left-4 text-red-400 hover:text-red-600 text-lg"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
            }
            // التعديل: تحديث الشات أوتوماتيك لو مفتوح
            if (window.currentChatOrderId) renderChatMessages();
        });

        window.updateOrderStatus = async function(id, newStatus) { await updateDoc(doc(db, "Orders", id), { status: newStatus }); }; 
        window.deleteOrder = async function(id) { if(confirm("حذف الطلب نهائياً؟")) await deleteDoc(doc(db, "Orders", id)); }
        window.showOrderBarcodesForPC = function(orderId) { const order = window.allActiveOrders.find(o => o.id === orderId); if(!order || !order.items || order.items.length === 0) return; let barcodesText = order.items.map(i => Array(i.qty).fill(i.barcode || i.id).join('\n')).join('\n'); document.getElementById('pcBarcodesArea').value = barcodesText; document.getElementById('pcBarcodesModal').classList.remove('hidden'); }

        // --- شات الفاتورة ---
        window.currentChatOrderId = null;
        window.openOrderChat = function(orderId) { window.currentChatOrderId = orderId; document.getElementById('orderChatModal').classList.remove('hidden'); renderChatMessages(); }
        window.closeOrderChat = function() { document.getElementById('orderChatModal').classList.add('hidden'); window.currentChatOrderId = null; }
        function renderChatMessages() {
            if(!window.currentChatOrderId) return;
            const order = window.allActiveOrders.find(o => o.id === window.currentChatOrderId);
            const area = document.getElementById('chatMessagesArea'); area.innerHTML = '';
            if(!order || !order.chat || order.chat.length === 0) { area.innerHTML = '<p class="text-center text-gray-400 font-bold mt-10">لا توجد رسائل.</p>'; return; }
            order.chat.forEach(msg => { let cssClass = msg.sender === 'admin' ? 'chat-bubble-admin' : 'chat-bubble-client'; let senderName = msg.sender === 'admin' ? 'المحل' : 'العميل'; area.innerHTML += `<div class="${cssClass}"><span class="text-[10px] text-gray-500 block mb-1">${senderName} - ${msg.time}</span><p class="text-sm font-bold text-gray-800">${msg.text}</p></div>`; });
            area.scrollTop = area.scrollHeight; 
        }
        window.sendOrderChatMessage = async function() {
            const input = document.getElementById('chatInput'); const text = input.value.trim(); if(text === '' || !window.currentChatOrderId) return;
            const msgObj = { sender: 'admin', text: text, time: new Date().toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit'}) };
            await updateDoc(doc(db, "Orders", window.currentChatOrderId), { chat: arrayUnion(msgObj) }); input.value = '';
        }

        // -------------------------
        // 2. العملاء (تعديل الـ CRM: فواتير، محاولات قابلة للتعديل، البونص المشطوب)
        // -------------------------
        onSnapshot(query(collection(db, "Users"), where("status", "==", "pending")), (snap) => { const div = document.getElementById('pendingUsersContainer'); div.innerHTML = ''; snap.forEach(d => { const u = d.data(); let typ = u.type==='wholesale'?'جملة':'قطاعي'; div.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-2 rounded border mb-2"><div class="text-sm"><p class="font-bold">${u.name} <span class="bg-yellow-200 text-xs px-1">${typ}</span></p></div><button onclick="approveUser('${u.phone}')" class="bg-purple-500 text-white px-3 py-1 rounded text-xs font-bold">تفعيل</button></div>`; }); });
        window.approveUser = async function(phone) { await updateDoc(doc(db, "Users", phone), { status: 'approved' }); }; 
        
        window.loadAllCustomers = async function() {
            const tbody = document.getElementById('crmTableBody'); tbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center font-bold text-gray-500">جاري التحميل...</td></tr>';
            const usersSnap = await getDocs(query(collection(db, "Users"), where("status", "==", "approved")));
            
            // سحب الفواتير عشان نحسب الإحصائيات والبونص القادم
            const qrsSnap = await getDocs(collection(db, "ScannedQRs"));
            let qrStats = {}; const today = new Date().toISOString().split('T')[0];
            qrsSnap.forEach(d => {
                let q = d.data();
                if(!qrStats[q.phone]) qrStats[q.phone] = { total:0, approved:0, pendingBonus:0 };
                qrStats[q.phone].total++;
                if(q.status === 'approved') qrStats[q.phone].approved++;
                if(q.bonusAmount > 0 && q.unlockDate > today) qrStats[q.phone].pendingBonus += q.bonusAmount;
            });

            tbody.innerHTML = '';
            if(usersSnap.empty) { tbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center">لا يوجد عملاء.</td></tr>'; return; }
            
            usersSnap.forEach(d => { 
                const u = d.data(); 
                let stat = qrStats[u.phone] || {total:0, approved:0, pendingBonus:0};
                let typ = u.type==='wholesale'?'جملة':'قطاعي'; 
                
                // شكل البونص (المتاح + اللي في الطريق)
                let bonusHtml = `<span class="text-green-600 font-black">${u.bonus||0} ج</span>`;
                if(stat.pendingBonus > 0) bonusHtml += `<br><span class="text-gray-400 text-xs line-through" title="في الطريق">${stat.pendingBonus} ج بالطريق</span>`;

                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2 font-bold">${u.name}<br><span class="bg-gray-200 text-xs px-1 rounded">${typ}</span><br><span class="text-xs text-gray-500" dir="ltr">${u.phone}</span></td>
                        <td class="p-2 text-center text-xs font-bold text-blue-600">${stat.total} / ${stat.approved}</td>
                        <td class="p-2 text-center"><span class="font-bold text-amber-600">${u.attempts}</span> <button onclick="editUserAttempts('${u.phone}', ${u.attempts})" class="text-gray-400 hover:text-blue-500 text-xs ml-1"><i class="fa-solid fa-pen"></i></button></td>
                        <td class="p-2 text-center">${bonusHtml}</td>
                    </tr>
                `; 
            }); 
        }

        window.editUserAttempts = async function(phone, currentAtt) {
            let newVal = prompt("أدخل الرصيد الجديد للاستعلامات:", currentAtt);
            if(newVal !== null && newVal.trim() !== '' && !isNaN(newVal)) {
                await updateDoc(doc(db, "Users", phone), { attempts: Number(newVal) });
                loadAllCustomers();
            }
        }

        window.checkCustomerBalance = async function() { let phone = document.getElementById('customerPhone').value.trim(); if(phone.startsWith('0')) phone = phone.substring(1); if(!phone.startsWith('+20')) phone = '+20'+phone; const uSnap = await getDoc(doc(db, "Users", phone)); if(uSnap.exists()) { window.currentCheckPhone = phone; document.getElementById('cName').innerText = uSnap.data().name; document.getElementById('cBalance').innerText = uSnap.data().bonus || 0; document.getElementById('balanceResult').classList.remove('hidden'); } else alert("رقم غير مسجل."); }
        window.deductBalance = async function() { const amt = Number(document.getElementById('deductAmount').value), cBal = Number(document.getElementById('cBalance').innerText); if(amt <= 0 || amt > cBal) return; if(confirm(`خصم ${amt}؟`)) { await updateDoc(doc(db, "Users", window.currentCheckPhone), { deductedBonus: increment(amt), bonus: increment(-amt) }); alert("تم الخصم!"); document.getElementById('balanceResult').classList.add('hidden'); document.getElementById('deductAmount').value = ''; loadAllCustomers(); } }

        // -------------------------
        // 3. رفع الإكسيل
        // -------------------------
        window.processProductsExcel = async function() { const file = document.getElementById('productsFile').files[0], stat = document.getElementById('productsStatus'); if(!file) return; stat.innerText = "جاري الرفع..."; const reader = new FileReader(); reader.onload = async (e) => { const data = XLSX.utils.sheet_to_json(XLSX.read(e.target.result, {type: 'array'}).Sheets[XLSX.read(e.target.result, {type: 'array'}).SheetNames[0]]); const q = await getDocs(collection(db, "Products")); let b = writeBatch(db); let c = 0; for(let d of q.docs) { b.delete(d.ref); c++; if(c===400){await b.commit(); b=writeBatch(db); c=0;} } if(c>0) await b.commit(); b = writeBatch(db); c = 0; for(let i=0; i<data.length; i++) { let it = data[i]; if(it.Item_Name && it.Price) { let bCode = String(it.Barcode || i).trim(); let gPrice = Number(it.Gomla_Price); if(isNaN(gPrice) || gPrice === 0) gPrice = Number(it.Price); b.set(doc(db, "Products", bCode), { Barcode: bCode, Item_Name: String(it.Item_Name), Price: Number(it.Price), Wholesale_Price: gPrice, Quantity: Number(it.Quantity)||0 }); c++; if(c===400 || i===data.length-1){await b.commit(); b=writeBatch(db); c=0;} } } stat.innerText = "تم الرفع بنجاح!"; stat.className = "mt-2 text-sm text-green-600"; loadAdminProducts(); }; reader.readAsArrayBuffer(file); }
        window.processBonusExcel = async function() { const file = document.getElementById('bonusFile').files[0], stat = document.getElementById('bonusStatus'); if (!file) return; stat.innerText = "جاري الحساب والتوزيع..."; const reader = new FileReader(); reader.onload = async function(e) { const data = XLSX.utils.sheet_to_json(XLSX.read(e.target.result, {type: 'array'}).Sheets[XLSX.read(e.target.result, {type: 'array'}).SheetNames[0]]); let count = 0; for(let row of data) { if(!row.QR_Code) continue; const qrRef = doc(db, "ScannedQRs", String(row.QR_Code)), qrSnap = await getDoc(qrRef); if(qrSnap.exists() && qrSnap.data().status === 'pending') { let originalInv = row.Original_Invoice || String(row.QR_Code); let excelDate = new Date(row.Date); if(isNaN(excelDate)) excelDate = new Date(); excelDate.setDate(excelDate.getDate() + 30); let unlockDateStr = excelDate.toISOString().split('T')[0]; await updateDoc(qrRef, { status: 'approved', bonusAmount: Number(row.Bonus)||0, originalInvoice: originalInv, unlockDate: unlockDateStr }); const userSnap = await getDoc(doc(db, "Users", qrSnap.data().phone)); if(userSnap.exists()) { let addedAttempts = userSnap.data().type === 'wholesale' ? 10 : 5; await updateDoc(doc(db, "Users", qrSnap.data().phone), { attempts: increment(addedAttempts) }); } count++; } } stat.innerText = `تم تأكيد ${count} فاتورة وإضافة المحاولات.`; stat.className = "mt-2 text-sm text-green-600"; }; reader.readAsArrayBuffer(file); }

        window.adminProductsList = [];
        async function loadAdminProducts() { const cached = localStorage.getItem('abuAdminProducts'); if (cached) { window.adminProductsList = JSON.parse(cached); } try { const q = await getDocs(collection(db, "Products")); let fresh = []; q.forEach((d) => { let dt = d.data(); dt.Barcode = dt.Barcode || d.id; fresh.push(dt); }); if(fresh.length > 0) { fresh.sort((a,b) => a.Item_Name.localeCompare(b.Item_Name, 'ar')); window.adminProductsList = fresh; localStorage.setItem('abuAdminProducts', JSON.stringify(fresh)); } } catch (e) {} }
        let searchTimeout; window.debouncedSearch = function() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { performSearch(); }, 300); }
        function performSearch() { const q = document.getElementById('adminSearchInput').value.trim().toLowerCase(), res = document.getElementById('adminSearchResults'); if(q === '') { res.innerHTML = ''; return; } const filtered = window.adminProductsList.filter(p => (p.Item_Name && p.Item_Name.toLowerCase().includes(q)) || (p.Barcode && p.Barcode.toLowerCase().includes(q))).slice(0, 50); res.innerHTML = ''; if(filtered.length === 0) { res.innerHTML = '<p class="text-center text-red-500 font-bold text-sm mt-2">الصنف غير موجود.</p>'; return; } filtered.forEach(p => { res.innerHTML += `<div class="bg-gray-50 p-2 rounded border border-gray-300 flex justify-between items-center mb-2"><div class="text-sm w-1/2"><span class="font-bold text-gray-800 block text-base">${p.Item_Name}</span><span class="text-gray-500 text-xs font-bold"><i class="fa-solid fa-barcode"></i> ${p.Barcode}</span></div><div class="text-left w-1/4"><span class="text-emerald-600 font-black text-lg block">${p.Price} ج</span></div><button onclick="addToAdminCart('${p.Barcode}')" class="bg-amber-500 text-gray-900 px-3 py-2 rounded font-bold shadow"><i class="fa-solid fa-plus"></i></button></div>`; }); }
        loadAdminProducts();
    </script>
    <script>
        window.playBeep = function() { try { const AudioContext = window.AudioContext || window.webkitAudioContext; const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gainNode = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); gainNode.gain.setValueAtTime(0.1, ctx.currentTime); osc.connect(gainNode); gainNode.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.1); } catch(e) {} }

        window.adminHtml5QrcodeScanner = null;
        window.startAdminScanner = function() { document.getElementById('adminReaderContainer').classList.remove('hidden'); if(!window.adminHtml5QrcodeScanner) { window.adminHtml5QrcodeScanner = new Html5Qrcode("adminReader", { formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8 ] }); } window.adminHtml5QrcodeScanner.start({ facingMode: "environment" }, { fps: 5 }, (decodedText) => { window.adminHtml5QrcodeScanner.stop().then(() => { document.getElementById('adminReaderContainer').classList.add('hidden'); document.getElementById('adminSearchInput').value = decodedText; performSearch(); }); }).catch(err => { alert("برجاء إعطاء صلاحية الكاميرا."); document.getElementById('adminReaderContainer').classList.add('hidden'); }); }
        window.stopAdminScanner = function() { if(window.adminHtml5QrcodeScanner) { window.adminHtml5QrcodeScanner.stop(); } document.getElementById('adminReaderContainer').classList.add('hidden'); }

        window.adminCart = JSON.parse(localStorage.getItem('abuAdminCart')) || [];
        window.addToAdminCart = function(barcode) { const product = window.adminProductsList.find(p => p.Barcode === barcode); if(!product) return; const existing = window.adminCart.find(i => i.barcode === barcode); if(existing) existing.qty += 1; else window.adminCart.push({ barcode: product.Barcode, name: product.Item_Name, price: product.Price, qty: 1 }); updateAdminCartUI(); window.playBeep(); }

        window.updateAdminCartUI = function() {
            localStorage.setItem('abuAdminCart', JSON.stringify(window.adminCart));
            const container = document.getElementById('adminCartContainer'), totalDisplay = document.getElementById('adminCartTotal'); container.innerHTML = ''; let total = 0;
            if(window.adminCart.length === 0) { container.innerHTML = '<p class="text-center text-gray-400 font-bold mt-4">الفاتورة فارغة.</p>'; totalDisplay.innerText = '0 ج'; return; }
            window.adminCart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `<div class="flex justify-between items-center border-b pb-2 mb-2 bg-gray-50 p-2 rounded"><div class="w-1/2"><p class="font-bold text-sm text-gray-800">${item.name}</p></div><div class="flex items-center gap-2 bg-gray-200 rounded p-1"><button onclick="changeAdminCartQty(${index}, 1)" class="px-2 font-bold bg-white rounded">+</button><span class="font-bold text-sm w-4 text-center">${item.qty}</span><button onclick="changeAdminCartQty(${index}, -1)" class="px-2 font-bold bg-white rounded">-</button></div><span class="font-black text-green-600 text-sm w-16 text-left">${item.price * item.qty} ج</span></div>`;
            });
            totalDisplay.innerText = `${total} ج`;
        }

        // التعديل هنا: تحذير المسح
        window.changeAdminCartQty = function(index, change) { 
            if(window.adminCart[index].qty === 1 && change === -1) { if(!confirm("هل تريد حذف هذا الصنف من الفاتورة؟")) return; }
            window.adminCart[index].qty += change; 
            if(window.adminCart[index].qty <= 0) window.adminCart.splice(index, 1); 
            updateAdminCartUI(); 
        }
        window.clearAdminCart = function() { if(confirm("مسح الفاتورة؟")) { window.adminCart = []; updateAdminCartUI(); } }

        window.showBarcodesForPCOffline = function() { if(window.adminCart.length === 0) return alert("الفاتورة فارغة!"); let barcodesText = window.adminCart.map(i => Array(i.qty).fill(i.barcode).join('\n')).join('\n'); document.getElementById('pcBarcodesArea').value = barcodesText; document.getElementById('pcBarcodesModal').classList.remove('hidden'); }
        window.closePcBarcodesModal = function() { document.getElementById('pcBarcodesModal').classList.add('hidden'); }
        window.copyFromTextarea = function() { const copyText = document.getElementById("pcBarcodesArea"); copyText.select(); document.execCommand("copy"); alert("تم النسخ!"); }
        window.shareAdminInvoice = function() { if(window.adminCart.length === 0) return alert("الفاتورة فارغة!"); let text = "*فاتورة مشتريات (أبو إسلام)*\n\n"; let total = 0; window.adminCart.forEach(i => { text += `- ${i.name} (${i.qty}) = ${i.price * i.qty} ج\n`; total += i.price * i.qty; }); text += `\n*الإجمالي: ${total} ج*`; window.open(`https://wa.me/?text=${encodeURIComponent(text)}`); }

        window.switchAdminTab = function(tabId) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); document.getElementById(tabId).classList.add('active'); const btns = ['btn-tabOrders', 'btn-tabCustomers', 'btn-tabData', 'btn-tabSearch']; btns.forEach(id => { document.getElementById(id).classList.remove('border-amber-500', 'text-amber-500'); document.getElementById(id).classList.add('border-transparent'); }); const activeBtn = document.getElementById('btn-' + tabId); activeBtn.classList.remove('border-transparent'); activeBtn.classList.add('border-amber-500', 'text-amber-500'); }
        updateAdminCartUI();
    </script>
</body>
</html>
