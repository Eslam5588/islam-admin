<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة أبو إسلام لقطع غيار التوك توك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .tab-content { display: none; } 
        .tab-content.active { display: block; } 
        .chat-bubble-admin { background-color: #d1fae5; border-radius: 10px 10px 0 10px; padding: 8px; margin-bottom: 8px; text-align: right; width: 80%; margin-right: auto; }
        .chat-bubble-client { background-color: #f3f4f6; border-radius: 10px 10px 10px 0; padding: 8px; margin-bottom: 8px; text-align: right; width: 80%; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="bg-gray-900 text-white sticky top-0 z-50 shadow-md">
        <h1 class="text-center font-black text-amber-500 py-3 text-xl"><i class="fa-solid fa-store"></i> لوحة الإدارة</h1>
        <div class="flex overflow-x-auto text-sm font-bold">
            <button onclick="switchAdminTab('tabSearch')" id="btn-tabSearch" class="flex-1 py-3 border-b-4 border-amber-500 text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-search"></i> الطوارئ</button>
            <button onclick="switchAdminTab('tabOrders')" id="btn-tabOrders" class="flex-1 py-3 border-b-4 border-transparent hover:text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-bell"></i> الطلبات</button>
            <button onclick="switchAdminTab('tabCustomers')" id="btn-tabCustomers" class="flex-1 py-3 border-b-4 border-transparent hover:text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-users"></i> العملاء</button>
            <button onclick="switchAdminTab('tabData')" id="btn-tabData" class="flex-1 py-3 border-b-4 border-transparent hover:text-amber-500 whitespace-nowrap px-4"><i class="fa-solid fa-file-excel"></i> الإكسيل</button>
        </div>
    </div>

    <div class="p-4 max-w-6xl mx-auto">

        <!-- ========================================== -->
        <!-- 1. دليل الأسعار + كاشير الطوارئ -->
        <!-- ========================================== -->
        <div id="tabSearch" class="tab-content active">
            <div class="bg-white p-4 rounded-xl shadow border-t-4 border-emerald-500 mb-6">
                <div class="flex gap-2 mb-2"><input type="text" id="adminSearchInput" oninput="debouncedSearch()" placeholder="اكتب الصنف أو الباركود..." class="w-full p-3 border-2 border-emerald-500 rounded-lg text-lg font-bold bg-gray-50 shadow-inner"><button onclick="startAdminScanner()" class="bg-emerald-500 text-white px-5 rounded-lg shadow font-bold hover:bg-emerald-600"><i class="fa-solid fa-barcode text-2xl"></i></button></div>
                <div id="adminReaderContainer" class="hidden mb-4 relative"><div id="adminReader" class="w-full rounded-xl overflow-hidden border-4 border-emerald-500 bg-black min-h-[250px]"></div><button onclick="stopAdminScanner()" class="mt-2 bg-red-100 text-red-600 px-4 py-2 rounded font-bold w-full">إغلاق الكاميرا</button></div>
                <div id="adminSearchResults" class="max-h-64 overflow-y-auto pr-2 space-y-2 mb-2"></div>
            </div>
            
            <div class="bg-gray-900 p-4 rounded-xl shadow-lg border-t-4 border-amber-500">
                <h2 class="text-xl font-bold text-white mb-4"><i class="fa-solid fa-receipt text-amber-500"></i> فاتورة طوارئ</h2>
                <div id="adminCartContainer" class="bg-white rounded-lg p-2 mb-4 min-h-[100px] max-h-64 overflow-y-auto space-y-2"></div>
                <div class="flex justify-between items-center bg-gray-800 p-3 rounded-lg text-white mb-4"><span class="font-bold">الإجمالي:</span><span class="font-black text-2xl text-amber-500" id="adminCartTotal">0 ج</span></div>
                <div class="grid grid-cols-2 gap-2">
                    <!-- التعديل هنا: اعتماد وواتساب -->
                    <button onclick="saveAdminInvoiceAsOrder()" class="bg-amber-500 text-gray-900 font-bold py-2 rounded shadow hover:bg-amber-600">اعتماد كطلب للكمبيوتر</button>
                    <button onclick="shareAdminInvoice()" class="bg-green-600 text-white font-bold py-2 rounded shadow hover:bg-green-700"><i class="fa-brands fa-whatsapp"></i> مشاركة</button>
                    <button onclick="clearAdminCart()" class="col-span-2 text-red-400 font-bold py-2 underline text-sm">مسح الفاتورة</button>
                </div>
            </div>
        </div>

        <!-- شاشة عرض الباركودات للنسخ -->
        <div id="pcBarcodesModal" class="fixed inset-0 bg-black bg-opacity-80 z-[1002] hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2"><h2 class="text-xl font-bold text-gray-800"><
